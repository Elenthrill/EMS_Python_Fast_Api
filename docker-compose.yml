version: "3.8"
services:
  dolt:
    image: dolthub/dolt-sql-server:latest
    container_name: dolt-server
    ports:
      - "3306:3306"
    environment:
      DOLT_DATABASE: mydb
      DOLT_USER: appuser
      DOLT_PASSWORD: apppass
    volumes:
      - dolt_data:/var/lib/dolt
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "dolt", "sql", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: dolt-adminer
    ports:
      - "8080:8080"            # веб-морда будет доступна на http://localhost:8080
    environment:
      ADMINER_DEFAULT_SERVER: dolt   # имя сервиса Dolt внутри сети Docker
    depends_on:
      - dolt

volumes:
  dolt_data: